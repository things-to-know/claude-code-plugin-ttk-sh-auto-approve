name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The hook runs on whatever `python3` is first on each user's PATH.
        # Keep the oldest version your teammates have in this list.
        # Warning: keep in sync with `TEST_PYTHON_VERSIONS` in the Makefile
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # For `DifferentialAgainstZsh`: the runner doesn't ship zsh. The version goes in the log, so
      # the one the differential ran against is on record.
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
          zsh --version
      - name: Run tests
        env:
          # A missing zsh fails the zsh differential instead of skipping it, which a green check
          # wouldn't show
          SH_AUTO_APPROVE_REQUIRE_ZSH: "1"
        run: make test

  # Lists, for each hook, the lines and branches no test runs. It sets no minimum, so only a failing
  # test fails it.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One version is enough: the only code that depends on it is each hook's Python and platform
      # guard, and the tests fake the version for it
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.21"
      # As in `test`, so that the report counts what `DifferentialAgainstZsh` runs too
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
          zsh --version
      - name: Measure coverage
        env:
          # `make test-coverage` runs the tests on .venv's Python. A path makes uv build .venv on
          # the interpreter above: given a version, or `python3`, uv prefers a Python it installed
          # itself, when there is one
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          # As in `test`: a missing zsh fails the zsh differential instead of skipping it
          SH_AUTO_APPROVE_REQUIRE_ZSH: "1"
        run: make test-coverage
      # It highlights the lines missed in each file, so reading it needs no local run
      - name: Upload the HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: error

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # `make` runs ruff through uv, at the version uv.lock pins, so CI formats exactly as
      # `make lint-fix` does
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.21"
      # Every other linter runs from its image, pinned by digest in the Makefile, even where the
      # runner ships its own copy, as it does shellcheck
      - name: Lint
        run: make lint LINTERS_FROM_IMAGES=1

  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    env:
      # `make validate` runs locally on whichever `claude` is on PATH, which updates itself almost
      # daily: bump this pin when the two give different results, not on every release
      CLAUDE_CODE_VERSION: "2.1.302"
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate plugin
        run: make validate

  # The one check the `main` ruleset requires, so a change to the matrix needs no ruleset edit
  # - A new job goes in `needs`, or a PR can merge with that job failing
  # - `always()`: it runs even after a failure or a cancellation, since a required check that is
  #   skipped counts as passed
  # - It checks no code, so it calls no `make` target
  ci-passed:
    name: ci passed
    if: ${{ always() }}
    needs: [test, coverage, lint, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job above succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            [[ "${result}" == success ]] || exit 1
          done
