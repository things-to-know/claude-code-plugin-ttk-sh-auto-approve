# The development tools, which uv installs into .venv: `make install-dev`, or any `make` target
# that runs one. Nothing here ships: the plugin is the stdlib-only scripts in plugin/.

[project]
name = "ttk-sh-auto-approve-dev"
# Required in a `[project]` table, and unused: nothing is built, and the plugin's version comes
# from the commit the catalog pins (see AGENTS.md, "No `version`")
version = "0"
# The oldest Python the hook supports, as in ruff.toml
requires-python = ">=3.12"

[dependency-groups]
dev = [
    # `make test-coverage`: `patch = ["subprocess"]`, below, needs 7.10 or later
    "coverage==7.17.0",
    # The formatter: its output has to match on every machine and in CI, so the version is exact
    "ruff==0.17.2",
]

[tool.uv]
# A set of tools, not a package: uv installs the dependencies and never builds this directory
package = false

# `make test-coverage`
[tool.coverage.run]
# Branches as well as lines: an `if` whose condition holds in every test has a branch no test takes
branch = true
# The hooks, not the tests
source = ["plugin/scripts"]
# Also measure the hooks the tests run as separate processes, as Claude Code does, `-I` included.
# Each process writes its own `.coverage.*` file, which `coverage combine` merges.
patch = ["subprocess"]

[tool.coverage.report]
# The line numbers no test runs, and each branch no test takes, as `<line>->exit` or
# `<line>-><line>`
show_missing = true
